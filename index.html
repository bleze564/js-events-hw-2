<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Галерея та генератор блоків</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section aria-labelledby="gallery-title">
        <h1 id="gallery-title">Галерея зображень</h1>
        <p>Перегортайте галерею стрілками ← і → або прокручуйте її.</p>

        <ul class="gallery" aria-label="Галерея зображень">
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/4617294/pexels-photo-4617294.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 1"
            />
          </li>
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/4617294/pexels-photo-4617294.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 2"
            />
          </li>
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/11815778/pexels-photo-11815778.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 3"
            />
          </li>
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/6195166/pexels-photo-6195166.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 4"
            />
          </li>
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/6957926/pexels-photo-6957926.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 5"
            />
          </li>
          <li>
            <img
              class="image"
              src="https://images.pexels.com/photos/15520825/pexels-photo-15520825.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt="Зображення галереї 6"
            />
          </li>
        </ul>
      </section>

      <section aria-labelledby="boxes-title">
        <h2 id="boxes-title">Колекція блоків</h2>
        <div id="controls">
          <label for="boxes-amount">Кількість блоків:</label>
          <input id="boxes-amount" type="number" min="0" max="100" step="1" />
          <button type="button" data-action="render">Створити</button>
          <button type="button" data-action="destroy">Очистити</button>
        </div>
        <div id="boxes" aria-live="polite"></div>
      </section>
    </main>

    <div
      class="full-image-container"
      role="dialog"
      aria-modal="true"
      aria-label="Перегляд зображення"
      aria-hidden="true"
    >
      <button class="close-button" type="button" aria-label="Закрити перегляд">
        &times;
      </button>
      <img class="full-image" alt="" />
    </div>
  </body>
</html>
